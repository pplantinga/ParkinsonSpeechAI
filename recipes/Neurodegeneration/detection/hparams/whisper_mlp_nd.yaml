# ################################
# Model: Dementia identification with Whisper + MLP
# Author: Briac Cordelle & Peter Plantinga
# ################################

# Basic parameters
seed: 42
__set_seed: !apply:torch.manual_seed [!ref <seed>]

# Save folders and paths
experiment_name: whisper_mlp_qpn_pitt
storage_folder: !PLACEHOLDER
output_folder: !ref <storage_folder>/<experiment_name>/seed_<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt
predictions_file: !ref <output_folder>/predictions.csv
encoded_labels: !ref <save_folder>/label_encoder.txt

# Data files
qpn_data_path: !PLACEHOLDER
pitt_data_path: !PLACEHOLDER
delaware_data_path: !PLACEHOLDER
noise_folder: !ref <storage_folder>/noise
train_annotation: !ref <save_folder>/train.json
valid_annotation: !ref <save_folder>/valid.json
test_annotation: !ref <save_folder>/test.json
noise_annotation: !ref <save_folder>/noise.csv
valid_metrics_json: !ref <output_folder>/valid_metrics.json
test_metrics_json: !ref <output_folder>/test_metrics.json

skip_prep: False
ckpt_interval_minutes: 15

# Noise augmentation data source
NOISE_DATASET_URL: /home/bcordel/projects/aip-ravenelm/bcordel/save/noise/data.zip

# Domain adversarial parameters
lambda_dann: 0.1
dataset_to_id:
    qpn: 0
    pitt: 1
    delaware: 2

# Training parameters
epochs: 30
warmup_epochs: 2
total_batch_size: 32
batch_size: 16
grad_accumulation_factor: !ref <total_batch_size> // <batch_size>
lr: 0.00015
weight_decay: 0.01
sample_rate: 16000
chunk_size: 30.0
loss: bce
samples_per_epoch: 4096

# Class weights for BCE loss — wire these into bce_loss or a sampler to take effect
weight_pd: 0.7
weight_hc: 1.5
weight_m: 0.7
weight_f: 1.5

# Test parameters
test_batch_size: 16
threshold: 0.5

# Model parameters
pretrained_source: openai/whisper-small
freeze_pretrained: True
feature_size: 768
embedding_size: 768
dropout: 0.2
out_neurons: 1
output_hidden: False

# Dataloader options
num_workers: 8
train_dataloader_options:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>

valid_dataloader_options:
    batch_size: !ref <test_batch_size>
    num_workers: !ref <num_workers>

test_dataloader_options:
    batch_size: !ref <test_batch_size>
    num_workers: !ref <num_workers>

# Augmentations
prepare_noise_data: !name:speechbrain.augment.preparation.prepare_dataset_from_URL
    URL: !ref <NOISE_DATASET_URL>
    dest_folder: !ref <noise_folder>
    ext: wav
    csv_file: !ref <noise_annotation>
    max_length: !ref <chunk_size>

add_noise: !new:speechbrain.augment.time_domain.AddNoise
    csv_file: !ref <noise_annotation>
    snr_low: 0
    snr_high: 15
    noise_sample_rate: !ref <sample_rate>
    clean_sample_rate: !ref <sample_rate>
    num_workers: !ref <num_workers>

drop_freq: !new:speechbrain.augment.time_domain.DropFreq
    drop_freq_low: 0
    drop_freq_high: 1
    drop_freq_count_low: 1
    drop_freq_count_high: 3
    drop_freq_width: 0.05

wav_augment: !new:speechbrain.augment.augmenter.Augmenter
    parallel_augment: False
    concat_original: False
    min_augmentations: 2
    max_augmentations: 2
    augment_prob: 0.95
    augmentations: [!ref <add_noise>, !ref <drop_freq>]

# Feature extractor (Whisper encoder)
compute_features: !new:speechbrain.lobes.models.huggingface_transformers.whisper.Whisper
    source: !ref <pretrained_source>
    encoder_only: True
    output_all_hiddens: !ref <output_hidden>
    freeze: !ref <freeze_pretrained>
    save_path: /home/bcordel/scratch/save/pretrained_models/models--openai--whisper-small/

# Embedding model: Linear -> Dropout -> LeakyReLU -> AttentionPooling -> Linear -> Dropout -> LeakyReLU
embedding_model: !new:torch.nn.Sequential
    - !new:speechbrain.nnet.linear.Linear
        input_size: !ref <feature_size>
        n_neurons: !ref <embedding_size>
    - !new:torch.nn.Dropout
        p: !ref <dropout>
    - !new:torch.nn.LeakyReLU
    - !new:speechbrain.nnet.pooling.AttentionPooling
        input_dim: !ref <embedding_size>
    - !new:speechbrain.nnet.linear.Linear
        input_size: !ref <embedding_size>
        n_neurons: !ref <embedding_size>
    - !new:torch.nn.Dropout
        p: !ref <dropout>
    - !new:torch.nn.LeakyReLU

classifier: !new:speechbrain.lobes.models.ECAPA_TDNN.Classifier
    input_size: !ref <embedding_size>
    out_neurons: !ref <out_neurons>

# Domain adversarial classifier: predicts dataset identity from reversed gradients
n_datasets: 3
dataset_classifier: !new:torch.nn.Linear
    in_features: !ref <embedding_size>
    out_features: !ref <n_datasets>

modules:
    compute_features: !ref <compute_features>
    embedding_model: !ref <embedding_model>
    classifier: !ref <classifier>
    dataset_classifier: !ref <dataset_classifier>

# Loss
bce_loss: !name:speechbrain.nnet.losses.bce_loss
    allowed_len_diff: 0
    label_smoothing: 0.01

# Optimizer
opt_class: !name:bitsandbytes.optim.Adam8bit
    lr: !ref <lr>
    weight_decay: !ref <weight_decay>

# Epoch counter — direction: min because we checkpoint on loss
epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounterWithStopper
    limit: !ref <epochs>
    limit_to_stop: 3
    limit_warmup: 20
    direction: max

# Logging
train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

# Error metric
error_stats: !name:speechbrain.utils.metric_stats.BinaryMetricStats
    positive_label: 1
error_metric: comb_avg_auc

# Checkpointer
checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        embedding_model: !ref <embedding_model>
        classifier: !ref <classifier>
        dataset_classifier: !ref <dataset_classifier>
        counter: !ref <epoch_counter>
